name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match 0.1.0 until configured otherwise)"
        required: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Import signing key
        env:
          PREVIEWKIT_SIGNING_KEY: ${{ secrets.PREVIEWKIT_SIGNING_KEY }}
        run: |
          echo "$PREVIEWKIT_SIGNING_KEY" | gpg --batch --import
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
      - name: Publish gradle plugin via Central bundle upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          ./gradlew :previewkit-gradle:publishToMavenLocal
          ROOT=~/.m2/repository
          STAGE=/tmp/bundle/io/github/artofpaganini/previewkit-gradle/0.1.0
          MARKER=/tmp/bundle/com/previewkit/com.previewkit.gradle.plugin/0.1.0
          mkdir -p "$STAGE" "$MARKER"
          cp $ROOT/io/github/artofpaganini/previewkit-gradle/0.1.0/* "$STAGE"/
          cp $ROOT/com/previewkit/com.previewkit.gradle.plugin/0.1.0/* "$MARKER"/
          cd /tmp/bundle
          zip -r ../previewkit-gradle-bundle.zip .
          CENTRAL_TOKEN="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          curl --fail-with-body -X POST \
            "https://central.sonatype.com/api/v1/publisher/upload?name=previewkit-gradle&publishingType=AUTOMATIC" \
            --header "Authorization: Bearer $CENTRAL_TOKEN" \
            -F "bundle=@../previewkit-gradle-bundle.zip"
      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.PREVIEWKIT_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.PREVIEWKIT_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.PREVIEWKIT_SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache
