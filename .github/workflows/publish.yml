name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match 0.1.0 until configured otherwise)"
        required: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Import signing key
        env:
          PREVIEWKIT_SIGNING_KEY: ${{ secrets.PREVIEWKIT_SIGNING_KEY }}
        run: |
          echo "$PREVIEWKIT_SIGNING_KEY" | gpg --batch --import
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.PREVIEWKIT_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.PREVIEWKIT_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.PREVIEWKIT_SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache
